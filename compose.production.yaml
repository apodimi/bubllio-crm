services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bubllio}
      POSTGRES_USER: ${POSTGRES_USER:-bubllio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - bubllio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bubllio} -d ${POSTGRES_DB:-bubllio}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  rabbitmq:
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: bubllio
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: bubllio
    volumes:
      - bubllio_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-true}
      DJANGO_TRUST_X_FORWARDED_PROTO: "true"
      BUBLLIO_APP_URL: ${BUBLLIO_APP_URL:?Set BUBLLIO_APP_URL}
      BUBLLIO_SETUP_TOKEN: ${BUBLLIO_SETUP_TOKEN:-}
      BUBLLIO_EMAIL_ENCRYPTION_KEYS: ${BUBLLIO_EMAIL_ENCRYPTION_KEYS:?Set BUBLLIO_EMAIL_ENCRYPTION_KEYS}
      BUBLLIO_EMAIL_ENCRYPTION_KEY: ${BUBLLIO_EMAIL_ENCRYPTION_KEY:-}
      CELERY_BROKER_URL: amqp://bubllio:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/bubllio
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - private

  worker:
    build: .
    restart: unless-stopped
    entrypoint: []
    command: [".venv/bin/celery", "--workdir=src", "-A", "bubllio_crm", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      BUBLLIO_APP_URL: ${BUBLLIO_APP_URL:?Set BUBLLIO_APP_URL}
      BUBLLIO_EMAIL_ENCRYPTION_KEYS: ${BUBLLIO_EMAIL_ENCRYPTION_KEYS:?Set BUBLLIO_EMAIL_ENCRYPTION_KEYS}
      BUBLLIO_EMAIL_ENCRYPTION_KEY: ${BUBLLIO_EMAIL_ENCRYPTION_KEY:-}
      CELERY_BROKER_URL: amqp://bubllio:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/bubllio
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - private

  beat:
    build: .
    restart: unless-stopped
    entrypoint: []
    command: [".venv/bin/celery", "--workdir=src", "-A", "bubllio_crm", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      CELERY_BROKER_URL: amqp://bubllio:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/bubllio
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - private

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BUBLLIO_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - private

volumes:
  bubllio_postgres_data:
  bubllio_rabbitmq_data:

networks:
  private:

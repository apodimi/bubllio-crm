services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bubllio
      POSTGRES_USER: bubllio
      POSTGRES_PASSWORD: bubllio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bubllio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubllio -d bubllio"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bubllio
      RABBITMQ_DEFAULT_PASS: bubllio
      RABBITMQ_DEFAULT_VHOST: bubllio
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - bubllio_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  bubllio_postgres_data:
  bubllio_rabbitmq_data:

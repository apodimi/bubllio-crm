name: Verify monorepo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-templates:
    name: Verify email templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email_templates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email_templates/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify compiled email is current
        run: git diff --exit-code -- ../src/organizations/templates/emails/transactional.html

  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bubllio_test
          POSTGRES_USER: bubllio
          POSTGRES_PASSWORD: bubllio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubllio -d bubllio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bubllio:bubllio@127.0.0.1:5432/bubllio_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment manifests
        env:
          POSTGRES_PASSWORD: ci-database-password
          DATABASE_URL: postgresql://bubllio:ci-database-password@postgres:5432/bubllio
          DJANGO_SECRET_KEY: ci-only-production-check-secret-with-more-than-fifty-characters
          DJANGO_ALLOWED_HOSTS: crm.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://crm.example.com
          BUBLLIO_APP_URL: https://crm.example.com
          BUBLLIO_EMAIL_ENCRYPTION_KEYS: bUPlTTVfJnkhIWpMJTdA7p9Xk0EuPgGDfJnGZhr2hMI=
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.dokploy.yaml config --quiet
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify release version alignment
        run: python scripts/check_release_version.py
      - run: uv sync --extra postgres
      - run: uv run python src/manage.py check
      - run: uv run python src/manage.py makemigrations --check --dry-run
      - run: uv run python src/manage.py test bubllio_crm organizations access onboarding companies contacts deals subscriptions accounts activities automations
      - name: Verify production security settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-production-check-secret-with-more-than-fifty-characters
          DJANGO_ALLOWED_HOSTS: crm.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://crm.example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          BUBLLIO_APP_URL: https://crm.example.com
          BUBLLIO_EMAIL_ENCRYPTION_KEYS: bUPlTTVfJnkhIWpMJTdA7p9Xk0EuPgGDfJnGZhr2hMI=
        run: uv run python src/manage.py check --deploy

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

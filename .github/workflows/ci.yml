name: Verify monorepo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: uv sync
      - run: uv run python src/manage.py check
      - run: uv run python src/manage.py makemigrations --check --dry-run
      - run: uv run python src/manage.py test bubllio_crm organizations companies contacts automations

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bubllio-crm-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bubllio-crm-frontend

jobs:
  verify:
    name: Verify release tree
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, attest, and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known

      - name: Validate release tag and policy
        id: release
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match project version {version}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
      - run: python scripts/check_release_version.py

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0

      - name: Build and publish backend candidate
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.BACKEND_IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            BUBLLIO_RELEASE_VERSION=${{ steps.release.outputs.version }}
            BUBLLIO_RELEASE_SHA=${{ github.sha }}

      - name: Build and publish frontend candidate
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: frontend
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.FRONTEND_IMAGE }}:candidate-${{ github.sha }}

      - name: Smoke exact candidate images
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          network="bubllio-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres="bubllio-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend="bubllio-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          frontend="bubllio-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$backend" "$frontend" "$postgres" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run --detach --name "$postgres" --network "$network" \
            --env POSTGRES_DB=bubllio \
            --env POSTGRES_USER=bubllio \
            --env POSTGRES_PASSWORD=release-smoke-password \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$postgres" pg_isready -U bubllio -d bubllio >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker run --detach --name "$backend" --network "$network" --network-alias backend \
            --publish 18000:8000 \
            --env DATABASE_URL="postgresql://bubllio:release-smoke-password@${postgres}:5432/bubllio" \
            --env DJANGO_DEBUG=false \
            --env DJANGO_SECRET_KEY=release-smoke-secret-with-more-than-fifty-characters \
            --env DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            --env DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:18000 \
            --env DJANGO_SECURE_SSL_REDIRECT=false \
            --env DJANGO_SESSION_COOKIE_SECURE=false \
            --env DJANGO_CSRF_COOKIE_SECURE=false \
            --env DJANGO_SECURE_HSTS_SECONDS=0 \
            --env BUBLLIO_APP_URL=http://127.0.0.1:18000 \
            --env BUBLLIO_EMAIL_ENCRYPTION_KEYS=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE= \
            "${BACKEND_IMAGE}@${BACKEND_DIGEST}" >/dev/null
          for attempt in $(seq 1 60); do
            if payload=$(curl --fail --silent --show-error http://127.0.0.1:18000/health/ 2>/dev/null); then
              HEALTH_PAYLOAD="$payload" python - <<'PY'
          import json
          import os

          health = json.loads(os.environ["HEALTH_PAYLOAD"])
          assert health == {
              "status": "ok",
              "version": os.environ["RELEASE_VERSION"],
              "commit_sha": os.environ["RELEASE_SHA"],
              "schema": f"bubllio-crm-{os.environ['RELEASE_VERSION']}",
          }
          PY
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$backend" >&2
              echo "Backend candidate did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done

          docker run --detach --name "$frontend" --network "$network" --publish 18080:8080 \
            "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$frontend" >&2
              echo "Frontend candidate did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Verify candidates are anonymously pullable
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker pull "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          DOCKER_CONFIG="$anonymous_config" docker pull "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Attest backend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Attest frontend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Build updater wheel
        working-directory: updater
        run: uv build --wheel --out-dir ../release-assets
      - name: Attest updater wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release-assets/*.whl

      - name: Create canonical release manifest
        run: >-
          python scripts/create_release_manifest.py
          --repository "${{ github.repository }}"
          --version "${{ steps.release.outputs.version }}"
          --commit-sha "${{ github.sha }}"
          --backend-digest "${{ steps.backend.outputs.digest }}"
          --frontend-digest "${{ steps.frontend.outputs.digest }}"
          --output release-assets/release-manifest.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release manifest with the workflow identity
        run: >-
          cosign sign-blob --yes
          --bundle release-assets/release-manifest.sigstore.json
          release-assets/release-manifest.json
      - name: Verify release manifest before publishing
        run: >-
          cosign verify-blob
          --bundle release-assets/release-manifest.sigstore.json
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          release-assets/release-manifest.json

      - name: Extract release notes
        run: >-
          python scripts/extract_release_notes.py
          "${{ steps.release.outputs.version }}"
          release-assets/release-notes.md
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "A published release already exists for ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Bubllio CRM ${{ steps.release.outputs.version }}" \
              --notes-file release-assets/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              release-assets/release-manifest.json \
              release-assets/release-manifest.sigstore.json \
              release-assets/*.whl
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --draft \
              --title "Bubllio CRM ${{ steps.release.outputs.version }}" \
              --notes-file release-assets/release-notes.md \
              release-assets/release-manifest.json \
              release-assets/release-manifest.sigstore.json \
              release-assets/*.whl
          fi

      - name: Promote verified candidates to version tags
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          promote() {
            repository="$1"
            digest="$2"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${repository}:${RELEASE_VERSION}" \
              "${repository}@${digest}"
            published_digest=$(
              docker buildx imagetools inspect "${repository}:${RELEASE_VERSION}" |
                awk '$1 == "Digest:" {print $2; exit}'
            )
            if [ "$published_digest" != "$digest" ]; then
              echo "Published digest mismatch for ${repository}" >&2
              exit 1
            fi
          }
          promote "$BACKEND_IMAGE" "$BACKEND_DIGEST"
          promote "$FRONTEND_IMAGE" "$FRONTEND_DIGEST"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

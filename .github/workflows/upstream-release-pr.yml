name: Propose upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-release-pr
  cancel-in-progress: false

jobs:
  propose:
    name: Open update pull request
    if: >-
      vars.BUBLLIO_UPSTREAM_REPOSITORY != '' &&
      (github.event_name == 'workflow_dispatch' || vars.BUBLLIO_SCHEDULED_UPDATE_PRS == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: ${{ vars.BUBLLIO_UPSTREAM_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate downstream configuration
        shell: bash
        run: |
          if [[ ! "$UPSTREAM_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "BUBLLIO_UPSTREAM_REPOSITORY must use the owner/repository format." >&2
            exit 1
          fi
          if [[ "$UPSTREAM_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            echo "The upstream repository must be different from this downstream repository." >&2
            exit 1
          fi

      - name: Discover latest stable release
        id: release
        shell: bash
        run: |
          latest_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported upstream release tag: $latest_tag" >&2
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "branch=automation/update-$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream release
        shell: bash
        run: |
          git remote add bubllio-upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --no-tags bubllio-upstream "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/${{ steps.release.outputs.tag }}"

      - name: Check whether release is already included
        id: included
        shell: bash
        run: |
          if git merge-base --is-ancestor "${{ steps.release.outputs.tag }}" HEAD; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.release.outputs.tag }} is already included." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing pull request
        if: steps.included.outputs.value == 'false'
        id: existing
        shell: bash
        run: |
          pr_url="$(gh pr list --state open --head "${{ steps.release.outputs.branch }}" --json url --jq '.[0].url // ""')"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          if [[ -n "$pr_url" ]]; then
            echo "An update pull request is already open: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge release into an update branch
        if: steps.included.outputs.value == 'false' && steps.existing.outputs.url == ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.release.outputs.branch }}"
          if ! git merge --no-ff --no-edit "${{ steps.release.outputs.tag }}"; then
            git merge --abort
            echo "The release has merge conflicts and needs a manual update." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --force-with-lease origin "HEAD:${{ steps.release.outputs.branch }}"

      - name: Open update pull request
        if: steps.included.outputs.value == 'false' && steps.existing.outputs.url == ''
        shell: bash
        run: |
          release_url="https://github.com/$UPSTREAM_REPOSITORY/releases/tag/${{ steps.release.outputs.tag }}"
          body_file="$RUNNER_TEMP/bubllio-update.md"
          {
            echo "## Bubllio CRM update"
            echo
            echo "This PR merges the verified upstream release **${{ steps.release.outputs.tag }}**."
            echo
            echo "- Read the [release notes]($release_url)."
            echo "- Wait for every repository check to pass."
            echo "- Take and verify a production database backup before deployment."
            echo "- After merge, deploy the updated main branch manually in Dokploy."
            echo "- Verify /health/, sign-in, and one critical CRM flow."
          } > "$body_file"
          pr_url="$(gh pr create \
            --base main \
            --head "${{ steps.release.outputs.branch }}" \
            --title "⬆️ Update Bubllio CRM to ${{ steps.release.outputs.tag }}" \
            --body-file "$body_file")"
          echo "Opened $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Start verification for the update branch
        if: steps.included.outputs.value == 'false' && steps.existing.outputs.url == ''
        shell: bash
        run: |
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ steps.release.outputs.branch }}"
          echo "Started the full verification workflow for the update branch." >> "$GITHUB_STEP_SUMMARY"
